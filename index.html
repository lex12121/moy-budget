<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой бюджет</title>

    <link rel="stylesheet" href="style.css">
</head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e7d32">
<body>

<header class="header">
    <h1>💰 Мой бюджет</h1>
</header>

<main>

    <!-- Карточка баланса -->
    <div class="card">

        <div class="card-title">
            Баланс
        </div>

        <div class="balance" id="balance">
    0 ₽
</div>

<div class="salary-week" id="salaryWeek">
    💰 Пт 01.05 → Чт 07.05
</div>

<div class="next-salary" id="nextSalary">
    Следующая зарплата: —
</div>

    </div>

    <!-- Кнопки -->
    <div class="buttons">

        <button id="incomeBtn" class="green">
            ➕ Добавить зарплату
        </button>

        <button id="expenseBtn" class="red">
            ➖ Добавить расход
        </button>

    </div>

    <!-- История -->
    <div class="card">

        <h2>Последние операции</h2>

        <ul id="operations">

            <li class="empty">
                Пока операций нет
            </li>

        </ul>

    </div>

</main>

<!-- Модальное окно -->

<div id="modal" class="overlay hidden">

    <div class="modal">

        <h2 id="modalTitle">
            Новая операция
        </h2>

        <input
            id="amount"
            type="number"
            placeholder="Введите сумму">

        <select id="category">

            <option value="Зарплата">💰 Зарплата</option>
            <option value="Продукты">🛒 Продукты</option>
            <option value="Жилье">🏠 Жилье</option>
            <option value="Транспорт">🚗 Транспорт</option>
            <option value="Кафе">☕ Кафе</option>
            <option value="Развлечения">🎮 Развлечения</option>
            <option value="Одежда">👕 Одежда</option>
            <option value="Здоровье">💊 Здоровье</option>
            <option value="Прочее">📦 Прочее</option>

        </select>

        <input
            id="comment"
            type="text"
            placeholder="Комментарий">

        <div class="modal-buttons">

            <button id="saveBtn" class="green">
                💾 Сохранить
            </button>

            <button id="cancelBtn">
                Отмена
            </button>

        </div>

    </div>

</div>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
